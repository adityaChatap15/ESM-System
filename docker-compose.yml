services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: esm_user
      POSTGRES_PASSWORD: esm_password
      POSTGRES_DB: esm_db
    ports:
      # Host port 5433, not 5432 - avoids clashing with a native Postgres
      # install some machines already run on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
